# bookscan configuration — paths, languages, thresholds, model choices.
# Every stage and tool reads settings from here (never hard-code paths).

# --- Tesseract (Stage 05 backbone + Gate 1 harness) ---
tesseract:
  # Windows default install path. Override if installed elsewhere.
  binary: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  # Directory holding *.traineddata (tessdata_best for eng/bul/ita/deu).
  # Relative paths resolve against the repo root; this dir is gitignored
  # (see models/ in .gitignore). Rebuild it with:
  #   python -m tools.setup_tessdata
  # (downloads the 4 traineddata AND copies Tesseract's configs/ — the latter
  # is required or --tessdata-dir silently drops TSV output.)
  tessdata_dir: "models/tessdata_best"
  oem: 1        # LSTM only
  psm: 3        # fully automatic page segmentation, no OSD

# --- Languages (OCR priority order) ---
# Tesseract lang codes; the 3-letter code is what -l expects.
languages:
  default: eng
  supported:
    - code: eng      # English
    - code: bul      # Bulgarian (Cyrillic)
    - code: ita      # Italian
    - code: deu      # German

# --- Adaptive confidence / uncertainty (Stage 06) ---
# NOTE: thresholds are adaptive PER DOCUMENT, never a single global cutoff.
# These are the knobs the adaptive logic tunes around, not fixed gates.
#
# The rule (Stage 06):
#   threshold = clip( percentile(word_confs, flag_rate*100), conf_floor, conf_ceiling )
#   a word is "uncertain" iff conf < threshold  (or a second engine disagrees).
# flag_rate is a TARGET that BENDS with the document: in a clean doc the ceiling
# bites (flag fewer than flag_rate — only the genuine low-conf tail); in a garbage
# doc the floor bites (flag MORE than flag_rate). The operating point moves with
# the confidence distribution between the two rails, so it is adaptive, not a
# single hard cutoff. Stage 06 records the raw + clamped threshold in meta.json.
uncertainty:
  # Default fraction of words to flag when using per-document adaptive threshold.
  flag_rate: 0.10
  # Sanity rails on the adaptive threshold (Tesseract conf scale 0-100). Anchored
  # to real testset per-word conf histograms (bg_01: p10=92, p50=96, genuine bad
  # tail <65; en_coins_01: p10=82, p50=96, tail <65). The clean bulk sits >=82, so
  # conf_ceiling=75 lands between bulk and tail: a clean doc flags only its real
  # low-conf tail (bg ~3%, en ~7%), never good words. conf_floor=45 is the minimum
  # threshold for a garbage doc (untested by the current all-clean testset, so a
  # theoretical rail for now). Tune these when a genuinely-garbled page lands.
  conf_floor: 45.0
  conf_ceiling: 75.0
  # Cross-engine disagreement is an independent trigger for "uncertain". Stage 05's
  # EasyOCR second opinion sets Word.engine_disagree (dictionary-gated — see
  # engines.easyocr.lexicon); Stage 06 ORs it into `uncertain`. Inert on a page
  # only when Stage 05 ran no second opinion (lang not enabled or lexicon absent).
  disagreement_is_trigger: true
  # Selectable output mode: flag | best_guess | patch
  default_mode: flag

# --- Stage 00 ingest (orientation) ---
# tools/normalize resolves orientation as a confidence-gated priority cascade.
# TWO OSD floors, not one, because the four rotations are not equally checkable:
#   * min_osd_conf     — a 90/270 call. A wrong one changes the page's aspect
#     ratio, so the cascade's landscape prior sees it. A low bar is safe, and it
#     is what lets the multi-zoom close-ups (real 90/270 rotations at confidence
#     2.0-17.6) be corrected at all.
#   * min_osd_conf_180 — a 180 call. NOTHING else can contradict it: a spread
#     rotated 180 is still landscape. Derived from two measured populations
#     (2026-08-19): WRONG 180 calls on known-upright buffers top out at 3.09
#     (n=7, real captures); CORRECT 180 calls on deliberately flipped testset
#     spreads start at 8.40 (n=25). 5.0 is the geometric midpoint of that gap.
#     Raising it refuses more flips; lowering it back to 2.0 reinstates the bug
#     that shipped a whole spread upside down.
ingest:
  min_osd_conf: 2.0
  min_osd_conf_180: 5.0

# --- Per-page frame selection (Stage 02, opt-in) ---
# Normally ONE photograph becomes both pages of a spread. Turn this on and the
# left page may be cut from frame A while the right comes from frame B —
# whichever reads better on that side once flattened. See pipeline/page_source.py.
#
# OFF by default for a MEASURED reason (RESULTS 2026-08-26): the two sides do
# prefer different photographs on 3 of 7 sets, but nothing clears the bar, and
# every cheap way of choosing is at chance (best 11 of 15 side races against 6.8
# by coin flip) — and picks the WRONG frame on the one race with real headroom.
# So the only criterion offered is the metric itself: dewarp each candidate's
# side and OCR it. That cannot lose, and it costs a Stage 03 dewarp plus a
# Tesseract pass per candidate per side. Sharpness/ink modes are deliberately
# not offered.
per_page_source:
  # NOTE: quoted — bare `off` is a YAML boolean (False), not the string.
  mode: "off"            # off | ocr
  # The reframing-churn floor (RESULTS 2026-08-19): how much this instrument's
  # word count moves when the framing changes at all. A validity boundary, not a
  # safety margin — below it a word-count difference is not measuring anything.
  # At this default the option changes nothing on the committed corpus; it is
  # built for multi-view capture, where two oblique frames trade sides.
  min_word_gain: 60
  require_conf_gain: true   # a challenger must also read at higher mean confidence
  dewarp_method: auto       # probe dewarp arm: auto | uvdoc | classical
  max_candidates: 4         # cost guard: full-spread frames scored per spread
  lang: null                # null -> languages.default

# --- Second-opinion engines (never the sole text/confidence source) ---
engines:
  easyocr:
    enabled_for: [bul]   # Cyrillic second opinion (production scope, per CLAUDE.md)
    langs: [bg, en]      # EasyOCR reader languages (bg = Bulgarian Cyrillic)
    gpu: true
    # EasyOCR only flags a Tesseract word (Word.engine_disagree) when its OWN
    # line-region confidence clears this floor — keeps EasyOCR's junk reads from
    # nominating alternatives. Tuned on the spike: kills 0.09 'L=' noise, keeps
    # 0.34+ real-content lines.
    min_region_conf: 0.30
    # Per-language lexicon paths (relative to repo root), keyed by Tesseract lang
    # code. THE DICTIONARY GATE that makes the disagreement trigger usable: flag
    # a Tesseract word only when it is a NON-word AND EasyOCR nominated a VALID
    # dictionary word in its place (see RESULTS.md 2026-07-18 — the raw diff was
    # ~0 precision on Cyrillic; EasyOCR is the noisier reader there).
    #
    # Each path is the .dic of a Hunspell pair (.dic + .aff), validated at runtime
    # by spylls (see second_opinion.HunspellLexicon) — surface forms are checked
    # morphologically, so inflections validate without being listed. For Bulgarian
    # a GeoNames gazetteer overlay (bg.geo.txt, alongside) is unioned on for the
    # toponym blind spot. A pair that does not exist -> the trigger is INERT and
    # EasyOCR is not even loaded.
    #
    # OWNER DEPENDENCY: no lexicon ships in the repo (models/ is gitignored), so
    # this seam is inert on a fresh clone. Build it locally with
    #   python -m tools.setup_lexicons        (downloads LibreOffice dicts + GeoNames-BG)
    # Activating it also feeds the Stage 08 de-hyphenation rule (same dependency).
    lexicon:
      bul: "models/lexicons/bg.dic"
      eng: "models/lexicons/en.dic"
      ita: "models/lexicons/it.dic"
      deu: "models/lexicons/de.dic"

# --- Models (loaded lazily per stage; VRAM released on CLI exit) ---
models:
  layout: doclayout-yolo
  dewarp: uvdoc
  dewarp_partial: doctr++

# --- Stage 03 dewarp ---
dewarp:
  # UVDoc checkpoint (~32 MB), gitignored under models/. Download from
  # github.com/tanguymagne/UVDoc (model/best_model.pkl). Relative paths resolve
  # against the repo root. Missing -> Stage 03 falls back to classical.
  uvdoc_ckpt: "models/uvdoc/best_model.pkl"

# --- Stage 04 layout + reading order ---
layout:
  # DocLayout-YOLO checkpoint (~40 MB), gitignored under models/. Download from
  # HF 'juliozhao/DocLayout-YOLO-DocStructBench'
  # (doclayout_yolo_docstructbench_imgsz1024.pt). Relative paths resolve against
  # the repo root. Missing -> Stage 04 falls back to classical (flagged).
  yolo_ckpt: "models/doclayout_yolo/doclayout_yolo_docstructbench_imgsz1024.pt"

  # Sub-threshold FIGURE rescue (Stage 04 v0.5.0). ON: on the 14 graded subpages it
  # recovers two real pictures the 0.25 confidence floor was dropping (it_geo_07 D1
  # at conf 0.247, it_geo_04 B6L at 0.229), adds ZERO boxes on the other 12
  # subpages, and leaves wrong caption<->figure pairs at 0. Its one cost is one
  # caption that stops being paired — see docs/RESULTS.md "The picture under the
  # floor" (2026-08-26). Honest limit: the three gates below are measured on THIS
  # 8-fixture corpus; every one sits in a measured gap, none is a guess, but a book
  # whose junk detections are more confident would need them re-measured.
  fig_rescue: true
  fig_rescue_conf: 0.10           # 2.1x above the junk cluster, 2.3x below the pictures
  fig_rescue_max_cover: 0.20      # admitted boxes score 0.000; nearest rejected 0.640
  fig_rescue_max_text_cover: 0.50 # printed matter 1.000, photographs 0.074/0.044
  fig_rescue_text_conf: 0.02      # floor of the TEXT set the gate above was MEASURED on;
                                  # raising it to 0.10 makes a faint scale bar's own text
                                  # box invisible and admits it -> a WRONG pair

# --- Reconstruction (Stages 07 assemble + 08 render) ---
# Stage 07 copies these into document.json's settings; Stage 08 render honors
# them (editing a setting in document.json + re-rendering just works).
reconstruct:
  fonts:
    # Noto covering Latin + Cyrillic; embed into the PDF.
    - Noto Serif
    - Noto Sans
  strip_running_headers: true   # user toggle
  strip_page_numbers: true      # user toggle
  # PDF backend for Stage 08 (owner decision: headless Chromium via Playwright).
  # Chromium renders the EXACT self-contained page.html render already produces,
  # so the PDF matches the browser preview (one rendering target, not two).
  #   chromium   -> Playwright headless Chromium (default; `playwright install chromium`)
  #   weasyprint -> secondary fallback if importable (its CSS engine may diverge)
  #   auto       -> chromium, then weasyprint, then HTML-only
  #   none       -> HTML-only (skip PDF)
  # Any backend that is chosen but unavailable falls through to the next; render
  # ALWAYS still writes page.html, so the gate is never blocked.
  pdf_backend: chromium
  # Blocks whose OCR cannot be trusted are re-typed FIGURE by Stage 07, so
  # Stage 08 renders the PIXELS instead of the noise (pipeline/unreadable_panel.py).
  # Built for de_01/de_02's icon sidebar: pictograms + scraps of text that OCR to
  # garbage and land early in reading order, but carry high-value information
  # (difficulty, walking times, GPS) that must not simply be dropped.
  # The cutoff is ADAPTIVE — a fraction of THIS job's median text-block
  # confidence, never a global number (CLAUDE.md). Measured over 15 testset
  # spreads / 326 assembled blocks: at these values exactly 4 blocks convert and
  # all 4 are unreadable junk. min_words 5 would convert 2 more (also junk);
  # min_words 3 starts converting real text ("English Version" headings), which
  # is why the floor sits where it does.
  unreadable_panels:
    conf_ratio: 0.75
    min_words: 8

# --- Vision-model book box (pipeline/vlm_box.py) ---
# Last-resort fallback for Stage 02: when the book detector finds nothing AND no
# operator drew a box, ask a local vision-language model (Ollama) where the book
# is and aim the SPINE SEARCH at its answer. It never changes which pixels are
# emitted as pages, so it cannot clip the book.
#
# ON by default because the detector provably cannot find a book on a pale or
# cluttered surface - eight cue families measured and closed (RESULTS
# 2026-08-28) - and the alternative is drawing every box by hand. Measured
# 21/21 gutters vs the detector's 19/21, zero regressions (RESULTS 2026-08-29).
# If Ollama is not running the request fails and Stage 02 behaves exactly as it
# did before, so leaving this on costs a page nothing but a timeout.
vlm_box:
  enabled: true
  url: "http://127.0.0.1:11434"
  model: "qwen3.6:27b"
  max_side: 1120       # the size the 21/21 result was measured at
  num_ctx: 8192        # Ollama truncates the image SILENTLY at its 4096 default
  timeout_s: 180

# --- Blocks that are not the book (Stage 07; pipeline/figure_surface.py) ---
# When the book detector cannot find the book on a pale surface, Stage 02 emits
# page images that still contain a band of the sofa - and Stage 04 correctly
# reports it as a large picture-shaped region. On the owner's 25-spread book, 16
# of 163 "figures" were the upholstery or the shadow behind it.
#
# Asks a local vision model TWICE - about the crop alone, and about the whole
# page with the block outlined - and flags the block only when both answers
# agree. Each single question discards real content (a printed photo of an
# information board; a tilted chapter banner); their intersection flagged 16 and
# lost nothing (RESULTS 2026-08-29).
#
# Nothing is deleted: the block is marked and Stage 08 skips it, so the editor
# can put it back. OFF by default - it needs a local service that may not be
# running, and it costs ~1.1 s per figure.
figure_surface:
  enabled: false
  url: "http://127.0.0.1:11434"
  model: "qwen3.6:27b"
  crop_max_side: 768    # the sizes the 16/16 result was measured at
  page_max_side: 1120
  num_ctx: 4096
  timeout_s: 180
  min_area_frac: 0.01   # a 21 px sliver is both arms' worst case, and nobody's complaint

# --- Higher-resolution figure assets (Stage 07; pipeline/figure_hires.py) ---
# The pictures matter as much as the text, and the anchor is the WHOLE spread in
# one photograph, so a figure gets whatever pixels are left after the page is
# divided up. The operator's close-ups hold more of it. Stage 01 cannot deliver
# them (it warps a close-up DOWN into the anchor, which resamples away the extra
# resolution before anything is written) — so the figure is re-cut from the frame
# that holds the most of it, at that frame's scale.
#
# Refusing is the normal outcome and costs nothing: the page crop stays. Set
# enabled: false to skip the pass entirely (or pass --no-figure-hires).
figure_hires:
  enabled: true
  detect_scale: 0.5     # SIFT on a half-size copy; full size is 4x slower for
                        # the same upgrades on this book (measured 2026-08-29)
  min_inliers: 20
  min_coverage: 0.90    # the SOURCES TOGETHER must hold this much of the figure;
                        # the rest is filled from the page crop, feathered.
                        # Do not lower it: at 0.61 the composite measured worse
                        # than the page crop it replaced (RESULTS 2026-08-29)
  min_ncc: 0.60         # per-source gate; wrong sources measured 0.51-0.52,
                        # correct ones 0.63-0.90
  min_result_ncc: 0.80  # backstop on the finished picture (see figure_hires.py)
  min_scale: 1.15       # below this the substitution is only a resampling
  max_scale: 4.0
  min_figure_px: 20000
  mesh_align: true      # bend each source onto the flattened page before laying
                        # it down; without it the sharpest-first composite tears
                        # at seams (measured on the via-ferrata topo map)
  mesh_tiles: 12
  mesh_max_frac: 0.02   # a correction bigger than this is an error, not a fit

# --- Paths ---
paths:
  jobs: "jobs"
  testset: "testset"
  results: "docs/RESULTS.md"
