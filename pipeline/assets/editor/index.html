<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bookscan · document editor</title>
<style>
  :root {
    --bg:#1e2127; --panel:#262b33; --panel2:#2f3640; --line:#3a424e;
    --fg:#e6e9ee; --muted:#9aa4b2; --accent:#5aa9ff; --flag:#e8c400; --patch:#d9534f;
    --edited:#5ad18b; --review:#e08b3a; --pair:#b07de0;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.4 system-ui,Segoe UI,sans-serif;
              background:var(--bg); color:var(--fg); }
  button, select, input, textarea { font:inherit; }
  button { background:var(--panel2); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#0a1120; border-color:var(--accent);
                   font-weight:600; }
  input, select, textarea { background:var(--panel); color:var(--fg);
           border:1px solid var(--line); border-radius:6px; padding:5px 7px; width:100%; }
  .row { display:flex; gap:8px; align-items:center; }
  .grow { flex:1; } .muted { color:var(--muted); } .small { font-size:12px; }
  header { display:flex; align-items:center; gap:12px; padding:8px 12px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header .title { font-weight:700; letter-spacing:.2px; }
  #app { display:flex; height:calc(100% - 49px); }
  #left { flex:1.35; min-width:0; overflow:auto; padding:12px; }
  #right { width:420px; min-width:360px; border-left:1px solid var(--line);
           display:flex; flex-direction:column; background:var(--panel); }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .canvas { position:relative; display:inline-block; max-width:100%;
            border:1px solid var(--line); background:#111; }
  .canvas img { display:block; max-width:100%; height:auto; }
  .overlay { position:absolute; inset:0; }
  .box { position:absolute; box-sizing:border-box; }
  .wbox { border:1px solid rgba(90,169,255,.35); cursor:pointer; }
  .wbox:hover { border-color:var(--accent); background:rgba(90,169,255,.12); }
  .wbox.flag { border-color:var(--flag); background:rgba(232,196,0,.16); }
  .wbox.patch { border-color:var(--patch); background:rgba(217,83,79,.14); }
  .wbox.edited { border-color:var(--edited); background:rgba(90,209,139,.14); }
  .wbox.sel { outline:2px solid #fff; outline-offset:0; }
  .bbox { border:1.5px dashed rgba(255,255,255,.25); pointer-events:none; }
  .bbox.review { border-color:var(--review); border-style:solid;
                 background:rgba(224,139,58,.08); }
  .bbox.pairing { border-color:var(--pair); border-style:solid;
                  background:rgba(176,125,224,.08); }
  .bbox.partner { border-color:var(--pair); border-style:solid; border-width:2.5px;
                  background:rgba(176,125,224,.14); }
  .bbox.sel { border-color:var(--accent); border-style:solid;
              background:rgba(90,169,255,.06); }
  .bbox .lbl { position:absolute; top:-16px; left:0; font-size:11px; padding:0 4px;
               background:var(--accent); color:#0a1120; border-radius:3px;
               white-space:nowrap; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { border:0; border-radius:0; background:transparent; padding:9px 14px;
                 color:var(--muted); }
  .tabs button.on { color:var(--fg); box-shadow:inset 0 -2px 0 var(--accent); }
  .pane { padding:12px; overflow:auto; flex:1; }
  .field { margin:0 0 10px; } .field label { display:block; margin-bottom:3px; }
  .badge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px;
           border:1px solid var(--line); margin-left:6px; }
  .badge.flag { color:var(--flag); border-color:var(--flag); }
  .badge.patch { color:var(--patch); border-color:var(--patch); }
  .badge.edited { color:var(--edited); border-color:var(--edited); }
  .badge.review { color:var(--review); border-color:var(--review); }
  .badge.pair { color:var(--pair); border-color:var(--pair); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; }
  .dot.review { background:var(--review); }
  .dot.pair { background:var(--pair); }
  .reviewbar { display:flex; gap:8px; align-items:center; margin:0 0 8px;
               padding:6px 8px; border:1px solid var(--review); border-radius:6px;
               background:rgba(224,139,58,.08); }
  .reviewbar.pair { border-color:var(--pair); background:rgba(176,125,224,.08); }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
          padding:10px; margin-bottom:12px; }
  .blocklist { display:flex; flex-direction:column; gap:4px; }
  .blockrow { display:flex; gap:8px; align-items:center; padding:5px 8px;
              border:1px solid var(--line); border-radius:6px; cursor:pointer;
              background:var(--panel); }
  .blockrow:hover { border-color:var(--accent); }
  .blockrow.sel { border-color:var(--accent); background:rgba(90,169,255,.08); }
  .blockrow .ord { font-variant-numeric:tabular-nums; color:var(--muted); width:2em; }
  .blockrow .ty { font-size:12px; color:var(--muted); }
  .blockrow .grip { color:var(--muted); cursor:grab; user-select:none; letter-spacing:-2px; }
  .blockrow.dragging { opacity:.45; }
  .blockrow.dropbefore { box-shadow:0 -2px 0 var(--accent); }
  .blockrow.dropafter  { box-shadow:0  2px 0 var(--accent); }
  .wordchip { display:inline-block; margin:2px; padding:2px 6px; border-radius:5px;
              border:1px solid var(--line); cursor:pointer; background:var(--panel); }
  .wordchip.flag { border-color:var(--flag); } .wordchip.patch { border-color:var(--patch); }
  .wordchip.edited { border-color:var(--edited); }
  .wordchip.sel { outline:2px solid var(--accent); }
  #status { margin-left:auto; font-size:12px; }
  #preview { width:100%; height:100%; border:0; background:#fff; border-radius:6px; }
  .patchthumb { max-height:40px; border:1px solid var(--patch); border-radius:4px;
                margin-top:4px; background:#fff; }
  .toggle { display:flex; gap:6px; align-items:center; }
  kbd { background:var(--panel2); border:1px solid var(--line); border-radius:4px;
        padding:0 5px; font-size:11px; }
</style>
</head>
<body>
<header>
  <span class="title">bookscan · editor</span>
  <span id="jobname" class="muted small"></span>
  <span style="width:12px"></span>
  <button id="prev">◀</button>
  <span id="pagelabel" class="small">—</span>
  <button id="next">▶</button>
  <span style="width:12px"></span>
  <button id="undo" title="Undo (Ctrl+Z) — session-only, not a server rollback" disabled>↶ Undo</button>
  <button id="save" class="primary">Save</button>
  <button id="render">Preview ▶</button>
  <span id="status" class="muted"></span>
</header>

<div id="app">
  <div id="left">
    <div class="toolbar">
      <label class="toggle small"><input type="checkbox" id="showWords" checked> words</label>
      <label class="toggle small"><input type="checkbox" id="showBlocks" checked> blocks</label>
      <span class="muted small">click a word or block to edit it</span>
    </div>
    <div class="canvas" id="canvas">
      <img id="pageimg" alt="page">
      <div class="overlay" id="ovBlocks"></div>
      <div class="overlay" id="ovWords"></div>
    </div>
  </div>

  <div id="right">
    <div class="tabs">
      <button data-tab="inspect" class="on">Inspect</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="preview">Preview</button>
    </div>
    <div class="pane" id="pane-inspect">
      <div id="inspector"><p class="muted">Select a word or block on the page.</p></div>
      <h4 class="muted small" style="margin:14px 0 6px">Blocks (reading order)</h4>
      <div class="blocklist" id="blocklist"></div>
    </div>
    <div class="pane" id="pane-settings" hidden>
      <div id="settings"></div>
    </div>
    <div class="pane" id="pane-preview" hidden style="display:flex;flex-direction:column;gap:8px;">
      <button id="refreshPreview">Refresh preview (HTML)</button>
      <iframe id="preview"></iframe>
    </div>
  </div>
</div>

<script>
const BLOCK_TYPES = ["title","paragraph","heading","list","table","figure",
  "caption","footnote","header","page_number","other"];
const state = { doc:null, pageIndex:0, selBlock:null, selWord:null, dirty:false, undo:[] };

const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e=document.createElement(t);
  if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
function page(){ return state.doc.pages[state.pageIndex]; }
function setStatus(msg, kind){ const s=$("#status"); s.textContent=msg;
  s.style.color = kind==="err" ? "var(--patch)" : kind==="ok" ? "var(--edited)" : "var(--muted)"; }
function markDirty(){ state.dirty=true; setStatus("unsaved changes"); }

// ---- undo (in-memory, session-only) ------------------------------------------
// A snapshot is the CURRENT PAGE's blocks + the document settings, deep-copied via
// JSON. Page-scoped on purpose: every structural action here (retype, renumber,
// drag, split, pair) is page-local, and snapshotting a whole book on each keystroke
// would cost more than the feature is worth.
//
// HONEST LIMIT, stated in the button's tooltip too: this is an in-memory stack, not
// a server rollback. It disappears on reload, and it does not un-write a Save that
// already happened — undo restores the in-memory state (edit flags included, since
// they live in the snapshotted blocks) and you must Save again for disk to agree.
// That the flags round-trip at all is what makes this safe: server-side
// `normalize_edits` only ever SETS flags from a divergence, so a restored snapshot
// whose text matches text_ocr again is written back un-flagged rather than staying
// stuck as "edited".
const UNDO_LIMIT = 60;
const UNDO_COALESCE_MS = 1500;

function snapshot(){
  return { pageIndex: state.pageIndex,
           blocks: JSON.stringify(page().blocks),
           settings: JSON.stringify(state.doc.settings) };
}

// Call BEFORE mutating. `key` coalesces a run of keystrokes in ONE field into a
// single undo step: while the same key stays on top of the stack and the user has
// not paused, the pre-edit snapshot already there is the one we want to keep.
function pushUndo(label, key){
  const top = state.undo[state.undo.length-1];
  const now = performance.now();
  if(key && top && top.key===key && (now - top.t) < UNDO_COALESCE_MS){
    top.t = now; return;
  }
  const snap = snapshot();
  snap.label = label; snap.key = key || null; snap.t = now;
  state.undo.push(snap);
  if(state.undo.length > UNDO_LIMIT) state.undo.shift();
  refreshUndo();
}

function undo(){
  const s = state.undo.pop();
  if(!s) return;
  state.pageIndex = s.pageIndex;
  state.doc.pages[s.pageIndex].blocks = JSON.parse(s.blocks);
  state.doc.settings = JSON.parse(s.settings);
  state.selWord = null;
  if(state.selBlock!=null && !findBlock(state.selBlock)) state.selBlock = null;
  state.dirty = true;
  renderAll(); refreshUndo();
  setStatus("undid: " + (s.label || "change") + " — unsaved");
}

function refreshUndo(){
  const b = $("#undo"); if(!b) return;
  const top = state.undo[state.undo.length-1];
  b.disabled = !top;
  b.title = top ? `Undo "${top.label}" (Ctrl+Z) — session-only, not a server rollback`
                : "Nothing to undo";
}

// ---- word helpers (mirror page_model.Word.flag_visible) ----
function isEdited(w){ return w.edited || (w.text_ocr!=null && w.text!==w.text_ocr); }
function flagVisible(w){ return (w.decision==="flag"||w.decision==="patch") && !isEdited(w); }
function wordClass(w){ if(isEdited(w)) return "edited";
  if(w.decision==="patch"&&flagVisible(w)) return "patch";
  if(w.decision==="flag"&&flagVisible(w)) return "flag"; return ""; }

// ---- reading-order review helpers (mirror page_model.Block.order_review_visible) ----
function orderMode(){ return (state.doc.settings.order_mode)||"auto"; }
function orderNeedsReview(blk){
  if(orderMode()!=="review") return false;
  if(blk.order_confirmed) return false;
  if(blk.order_auto!=null && blk.reading_order!==blk.order_auto) return false;  // renumbered
  return true;
}
function pageBlocksNeedingReview(){ return page().blocks.filter(orderNeedsReview); }
function confirmOrder(blk, on){ pushUndo(on?"confirm order":"undo confirm order");
  blk.order_confirmed=!!on; markDirty();
  renderPage(); renderBlockList(); renderInspector(); }
function confirmAllOnPage(){ pushUndo("confirm order on every block");
  for(const blk of page().blocks){ if(orderNeedsReview(blk)) blk.order_confirmed=true; }
  markDirty(); renderPage(); renderBlockList(); renderInspector(); }

// ---- caption<->figure pairing helpers (mirror page_model.Block.figure_ref / PairSource) ----
// The grouping pass (pipeline/figure_grouping.py) ABSTAINS whenever it cannot prove a
// pair — its bar is zero WRONG pairs, not many pairs — so unpaired captions are normal,
// not a bug, and this is where a human resolves them. Everything a human sets here is
// stamped pair_source="user", including an UNPAIR (figure_ref null): that stamp is the
// only thing standing between the correction and the next re-assemble (see
// editor.py:_document_has_edits) and the only thing stopping stage08_render's
// adjacency fallback from silently re-pairing a caption the user just detached.
// v1 is SAME-PAGE ONLY: figure_ref is a page-scoped BlockRef and the schema can express
// a cross-page pair (it_geo_04's gutter-split Fig.21 panorama), but neither this editor
// nor stage08_render floats a caption across pages yet — an existing off-page ref is
// shown read-only rather than silently rewritten or dropped.
function isCaption(blk){ return blk.type==="caption"; }
function isFigure(blk){ return blk.type==="figure"; }
function pageFigures(){ return page().blocks.filter(isFigure)
  .sort((a,b)=>a.reading_order-b.reading_order); }
function refIsOffPage(blk){ return !!blk.figure_ref && blk.figure_ref.page_id!==page().page_id; }
function pairedFigure(blk){                       // the figure this caption points at, this page
  if(!blk.figure_ref || refIsOffPage(blk)) return null;
  return page().blocks.find(b=>b.id===blk.figure_ref.block_id) || null;
}
// Which caption the RENDERER will actually put inside this figure. Mirrors
// stage08_render._caption_bindings exactly: a human ruling outranks an inferred one,
// then reading order breaks the tie. A figure holds ONE caption, so a caption that
// loses the figure renders standalone — the UI must say so rather than show a pair
// the deliverable ignores.
function captionForFigure(fig){
  const claims = page().blocks.filter(b=>isCaption(b) && b.figure_ref
      && b.figure_ref.page_id===page().page_id && b.figure_ref.block_id===fig.id)
    .sort((a,b)=>a.reading_order-b.reading_order);
  return claims.find(b=>b.pair_source==="user") || claims[0] || null;
}
function captionClaimLost(blk){                   // paired in the data, standalone in the output
  const f = isCaption(blk) ? pairedFigure(blk) : null;
  if(!f) return false;
  const w = captionForFigure(f);
  return !!w && w.id!==blk.id;
}
// "needs pairing" = nothing will attach this caption to a figure in the rendered
// output: the pass abstained and no human has ruled, OR its claim lost the figure to
// another caption. A user's deliberate unpair is a decision, so it clears the marker —
// the per-block analogue of order_review_visible keying on the order field specifically.
function captionNeedsPairing(blk){
  if(!isCaption(blk)) return false;
  if(captionClaimLost(blk)) return true;
  return !blk.figure_ref && blk.pair_source!=="user"; }
function pageCaptionsNeedingPairing(){ return page().blocks.filter(captionNeedsPairing); }
function partnerId(blk){                          // block to highlight alongside the selection
  if(isCaption(blk)){ const f=pairedFigure(blk); return f ? f.id : null; }
  if(isFigure(blk)){ const c=captionForFigure(blk); return c ? c.id : null; }
  return null;
}
function setPair(blk, figId){
  pushUndo(figId==null ? "unpair caption" : "pair caption to figure");
  blk.figure_ref = (figId==null) ? null : { page_id: page().page_id, block_id: figId };
  blk.pair_source = "user";
  markDirty(); renderPage(); renderBlockList(); renderInspector();
}

// ---- structure edits: reorder + split -----------------------------------------
// Two rules hold for BOTH, and they are the reason this is not just array surgery:
//
// 1. BLOCK IDS ARE NEVER REASSIGNED. `figure_ref` is a {page_id, block_id} pointer
//    (page_model.BlockRef) and the PUT endpoint validates the document's SHAPE, not
//    its referential integrity — a dangling ref would save silently and the caption
//    would quietly stop floating with its figure. Reordering therefore rewrites
//    `reading_order` only, and a split ALLOCATES a fresh id above every id on the
//    page rather than renumbering anything.
//
// 2. REORDERING IS A DENSE 0..n-1 PERMUTATION. `reading_order` is only ever used as
//    a sort key (stage08_render sorts the page by it), so duplicates and gaps sort
//    ambiguously. Writing back the full permutation also keeps the side effect on
//    review markers as small as it can be: after moving one block within an already
//    dense page, every block OUTSIDE the span it travelled keeps the exact number it
//    had, so its "needs review" marker survives untouched. The blocks INSIDE the span
//    are precisely the ones the user dragged the block past — a real pairwise ruling
//    on their order — and their marker clearing is the honest outcome, not a bug.
//    (If a page was left non-dense by hand-typed numbers, the first reorder
//    normalizes it and can clear more markers than it moved. Undo covers that.)

function applyOrder(seq){ seq.forEach((b,i)=>{ b.reading_order = i; }); }
function orderedBlocks(){ return [...page().blocks].sort((a,b)=>a.reading_order-b.reading_order); }

// Move the block with `id` so it lands at position `toIndex` of the CURRENT ordered
// sequence (an insertion index in 0..n, i.e. "before the block currently at toIndex").
function moveBlock(id, toIndex){
  const seq = orderedBlocks();
  const from = seq.findIndex(b=>b.id===id);
  if(from < 0) return;
  let to = Math.max(0, Math.min(seq.length, toIndex));
  if(to > from) to--;                       // the removal shifts everything after it
  if(to === from) return;                   // dropped where it already was
  pushUndo("move block");
  const [moved] = seq.splice(from, 1);
  seq.splice(to, 0, moved);
  applyOrder(seq);
  markDirty(); renderPage(); renderBlockList(); renderInspector();
}

function nudgeBlock(id, delta){
  const seq = orderedBlocks();
  const at = seq.findIndex(b=>b.id===id);
  if(at < 0) return;
  // moveBlock takes an insertion index into the UNCHANGED sequence, so stepping one
  // slot down means inserting at at+2 (past the neighbour), not at+1.
  moveBlock(id, delta < 0 ? at - 1 : at + 2);
}

// A block can be split only where doing so is meaningful AND lossless.
function splitBlocked(blk){
  if(blk.type === "figure")
    return "a figure renders from its cropped pixels, not its words — splitting it would change nothing in the output";
  if(blk.text != null)
    return "this block has a block-level text override (a translation), which supersedes the words — clear it first, or the split would not show in the output";
  if(!blk.words || blk.words.length < 2) return "needs at least two words to split";
  return null;
}

function unionBox(words){
  const x0=Math.min(...words.map(w=>w.bbox.x)), y0=Math.min(...words.map(w=>w.bbox.y));
  const x1=Math.max(...words.map(w=>w.bbox.x+w.bbox.w)), y1=Math.max(...words.map(w=>w.bbox.y+w.bbox.h));
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}

// Split `blk` so that word index `wi` starts a NEW block placed immediately after it.
function splitBlock(blk, wi){
  if(splitBlocked(blk)) return;
  if(wi <= 0 || wi >= blk.words.length) return;
  pushUndo("split block");
  const p = page();
  const head = blk.words.slice(0, wi), tail = blk.words.slice(wi);
  const newId = 1 + p.blocks.reduce((m,b)=>Math.max(m, b.id), -1);   // never reuse an id
  const nb = {
    id: newId, type: blk.type, bbox: unionBox(tail),
    reading_order: blk.reading_order,          // real value assigned by applyOrder below
    words: tail.map(w=>Object.assign({}, w, { block_id: newId })),
    // No automatic provenance exists for a block the pipeline never proposed, so both
    // *_auto stay null — which is exactly why `structure_edited` has to be set by hand
    // here: server-side normalize_edits infers the flag from a type/order DIVERGENCE
    // against *_auto, and with no auto value there is nothing to diverge from. Without
    // the flag, assemble's clobber-detection would not see the split as work worth
    // protecting and a later re-assemble would silently discard it.
    type_auto: null, order_auto: null,
    structure_edited: true, order_confirmed: false, text: null,
    // Pairing state belongs to the ORIGINAL block: a figure holds one caption, so the
    // tail must not walk away with a second claim on the same figure.
    caption_number: null, figure_number: null, figure_ref: null,
    pair_source: null, type_promoted: false,
  };
  // Both halves get the geometry of the words they actually own — the bbox is what
  // masks text out of an overlapping figure crop, so leaving the head at its old full
  // extent would keep masking pixels it no longer covers.
  blk.words = head;
  blk.bbox = unionBox(head);
  blk.structure_edited = true;

  const seq = orderedBlocks();
  seq.splice(seq.findIndex(b=>b.id===blk.id) + 1, 0, nb);
  p.blocks.push(nb);
  applyOrder(seq);
  markDirty(); selectBlock(newId);
}

// ---- load ----
async function load(){
  const meta = await (await fetch("api/meta")).json();
  $("#jobname").textContent = meta.job;
  state.doc = await (await fetch("api/document")).json();
  state.pageIndex = 0; state.selBlock=null; state.selWord=null;
  renderAll(); setStatus("loaded", "ok");
}

function renderAll(){ renderPage(); renderInspector(); renderBlockList(); renderSettings(); refreshUndo(); }

// ---- page image + overlays ----
function renderPage(){
  const p = page();
  $("#pagelabel").textContent = `${p.page_id}  (${state.pageIndex+1}/${state.doc.pages.length})`;
  const img = $("#pageimg");
  img.src = p.image_asset;                  // relative: resolves under this job's base URL
  drawOverlays();
}
function pct(v, total){ return (100*v/total) + "%"; }
function drawOverlays(){
  const p = page(), W=p.width, H=p.height;
  const ovB=$("#ovBlocks"), ovW=$("#ovWords");
  ovB.innerHTML=""; ovW.innerHTML="";
  ovB.style.display = $("#showBlocks").checked ? "block":"none";
  ovW.style.display = $("#showWords").checked ? "block":"none";
  const blocks = [...p.blocks].sort((a,b)=>a.reading_order-b.reading_order);
  const sel = state.selBlock==null ? null : findBlock(state.selBlock);
  const partner = sel ? partnerId(sel) : null;
  for(const blk of p.blocks){
    const b = el("div","box bbox"); const bb=blk.bbox;
    b.style.left=pct(bb.x,W); b.style.top=pct(bb.y,H);
    b.style.width=pct(bb.w,W); b.style.height=pct(bb.h,H);
    const needsRev = orderNeedsReview(blk);
    const needsPair = captionNeedsPairing(blk);
    if(needsRev) b.classList.add("review");
    if(needsPair) b.classList.add("pairing");
    if(partner===blk.id) b.classList.add("partner");   // the caption/figure of the selection
    if(state.selBlock===blk.id) b.classList.add("sel");
    const fig = isCaption(blk) ? pairedFigure(blk) : null;
    const pairMark = fig ? (captionClaimLost(blk) ? ` →#${fig.id} ⚠` : ` →#${fig.id}`)
                         : (needsPair ? " ⛓" : "");
    const lbl = el("span","lbl",
      `${blk.reading_order} ${blk.type}${blk.structure_edited?" *":""}${needsRev?" ⚑":""}${pairMark}`);
    b.appendChild(lbl); ovB.appendChild(b);
    (blk.words||[]).forEach((w,wi)=>{
      const e = el("div","box wbox "+wordClass(w));
      e.style.left=pct(w.bbox.x,W); e.style.top=pct(w.bbox.y,H);
      e.style.width=pct(w.bbox.w,W); e.style.height=pct(w.bbox.h,H);
      e.title = w.text;
      if(state.selBlock===blk.id && state.selWord===wi) e.classList.add("sel");
      e.onclick = ev => { ev.stopPropagation(); selectWord(blk.id, wi); };
      ovW.appendChild(e);
    });
  }
}

// ---- selection ----
function findBlock(id){ return page().blocks.find(b=>b.id===id); }
function selectBlock(id){ state.selBlock=id; state.selWord=null; renderPage(); renderInspector(); renderBlockList(); }
function selectWord(blockId, wi){ state.selBlock=blockId; state.selWord=wi; renderPage(); renderInspector(); renderBlockList(); }

// ---- inspector ----
function renderInspector(){
  const host = $("#inspector"); host.innerHTML="";
  if(state.selBlock==null){ host.appendChild(el("p","muted","Select a word or block on the page.")); return; }
  const blk = findBlock(state.selBlock);
  if(!blk){ host.innerHTML=""; return; }
  if(state.selWord!=null && blk.words[state.selWord]) host.appendChild(wordEditor(blk, state.selWord));
  host.appendChild(blockEditor(blk));
}

function wordEditor(blk, wi){
  const w = blk.words[wi];
  const c = el("div","card");
  const head = el("div","row");
  head.appendChild(el("strong",null,`Word #${wi}`));
  if(isEdited(w)) head.appendChild(el("span","badge edited","edited"));
  else if(flagVisible(w) && w.decision==="flag") head.appendChild(el("span","badge flag","flag"));
  else if(flagVisible(w) && w.decision==="patch") head.appendChild(el("span","badge patch","patch"));
  c.appendChild(head);

  const f1 = el("div","field");
  f1.appendChild(el("label","small muted","text (edit here)"));
  const inp = el("input"); inp.value=w.text;
  inp.oninput = () => { pushUndo("edit word text", `w:${blk.id}:${wi}`);
    w.text=inp.value; markDirty(); drawOverlays(); refreshWordBadges(); };
  f1.appendChild(inp); c.appendChild(f1);

  const f2 = el("div","field");
  f2.appendChild(el("label","small muted","OCR original (text_ocr · provenance, read-only)"));
  const ocr = el("input"); ocr.value=(w.text_ocr==null?"—":w.text_ocr); ocr.readOnly=true;
  ocr.style.opacity=".7"; f2.appendChild(ocr); c.appendChild(f2);

  c.appendChild(el("div","small muted",
    `conf ${Number(w.conf).toFixed(0)} · decision ${w.decision||"—"} · engine ${w.engine||"—"}`));
  if(w.patch_asset){
    const im = el("img","patchthumb"); im.src=w.patch_asset; c.appendChild(im);
  }
  const rev = el("button",null,"Revert to OCR");
  rev.style.marginTop="8px";
  rev.onclick = () => { pushUndo("revert word to OCR");
    if(w.text_ocr!=null){ w.text=w.text_ocr; w.edited=false; }
    markDirty(); renderInspector(); drawOverlays(); };
  c.appendChild(rev);
  return c;
}

function refreshWordBadges(){ /* header badges update on next full inspector render */ }

function blockEditor(blk){
  const c = el("div","card");
  const head = el("div","row");
  head.appendChild(el("strong",null,`Block #${blk.id}`));
  if(blk.structure_edited) head.appendChild(el("span","badge edited","structure edited"));
  if(orderMode()==="review"){
    head.appendChild(el("span", "badge " + (orderNeedsReview(blk)?"review":"edited"),
      orderNeedsReview(blk) ? "order: review" : "order: ok"));
  }
  if(isCaption(blk)){
    if(captionClaimLost(blk)) head.appendChild(el("span","badge pair","figure taken"));
    else if(captionNeedsPairing(blk)) head.appendChild(el("span","badge pair","no figure"));
    else if(blk.pair_source==="user")
      head.appendChild(el("span","badge edited", blk.figure_ref ? "pair: you" : "unpaired: you"));
    else if(blk.figure_ref)
      head.appendChild(el("span","badge","pair: "+(blk.pair_source||"?")));
  }
  c.appendChild(head);

  const f1 = el("div","field");
  f1.appendChild(el("label","small muted","type"));
  const sel = el("select");
  BLOCK_TYPES.forEach(t=>{ const o=el("option",null,t); o.value=t; if(t===blk.type)o.selected=true; sel.appendChild(o); });
  sel.onchange = () => { pushUndo("change block type");
    blk.type=sel.value; markDirty(); drawOverlays(); renderBlockList(); renderInspector(); };
  f1.appendChild(sel);
  if(blk.type_auto!=null && blk.type_auto!==blk.type)
    f1.appendChild(el("div","small muted",`auto: ${blk.type_auto}`));
  c.appendChild(f1);

  const f2 = el("div","field");
  f2.appendChild(el("label","small muted","reading order"));
  const ord = el("input"); ord.type="number"; ord.step="1"; ord.value=blk.reading_order;
  ord.onchange = () => { pushUndo("renumber block");
    blk.reading_order=parseInt(ord.value||"0",10); markDirty();
    drawOverlays(); renderBlockList(); };
  f2.appendChild(ord);
  if(blk.order_auto!=null && blk.order_auto!==blk.reading_order)
    f2.appendChild(el("div","small muted",`auto: ${blk.order_auto}`));
  c.appendChild(f2);

  if(orderMode()==="review"){
    const rv = el("div","field");
    if(orderNeedsReview(blk)){
      rv.appendChild(el("div","small muted",
        "reading order not yet reviewed — renumber above, or accept the auto order:"));
      const ok=el("button",null,"Confirm order ✓"); ok.onclick=()=>confirmOrder(blk,true);
      rv.appendChild(ok);
    } else if(blk.order_confirmed){
      rv.appendChild(el("div","small muted","auto order confirmed by you"));
      const un=el("button",null,"Undo confirm"); un.onclick=()=>confirmOrder(blk,false);
      rv.appendChild(un);
    } else {
      rv.appendChild(el("div","small muted","order reviewed (renumbered)"));
    }
    c.appendChild(rv);
  }

  if(isCaption(blk) || isFigure(blk)) c.appendChild(pairingField(blk));

  const f3 = el("div","field");
  f3.appendChild(el("label","small muted","translation / block-level text override (supersedes words when set)"));
  const ta = el("textarea"); ta.rows=3; ta.value = blk.text==null ? "" : blk.text;
  ta.placeholder = "leave empty to render the words above";
  ta.oninput = () => { pushUndo("edit block text override", `bt:${blk.id}`);
    blk.text = ta.value==="" ? null : ta.value; markDirty(); };
  f3.appendChild(ta); c.appendChild(f3);

  if(blk.words && blk.words.length){
    c.appendChild(el("div","small muted","words (click to edit):"));
    const wrap = el("div"); wrap.style.marginTop="4px";
    blk.words.forEach((w,wi)=>{ const chip=el("span","wordchip "+wordClass(w), w.text||"·");
      if(state.selWord===wi) chip.classList.add("sel");
      chip.onclick=()=>selectWord(blk.id,wi); wrap.appendChild(chip); });
    c.appendChild(wrap);
    c.appendChild(splitField(blk));
  }
  return c;
}

// ---- split control ----
// The split point is the SELECTED WORD: everything from it onward moves into a new
// block placed right after this one. Anchoring on the selection rather than on an
// index box means the user picks the boundary by clicking the word they can see.
function splitField(blk){
  const f = el("div","field"); f.style.marginTop="10px";
  const why = splitBlocked(blk);
  if(why){ f.appendChild(el("div","small muted","split unavailable — " + why)); return f; }
  const wi = state.selWord;
  if(wi==null || wi<=0){
    f.appendChild(el("div","small muted",
      "to split: click the word that should START the second block (any word but the first)."));
    return f;
  }
  const w = blk.words[wi];
  const btn = el("button", null, `Split here — "${w && w.text ? w.text : "·"}" starts a new block`);
  btn.onclick = ()=>splitBlock(blk, wi);
  f.appendChild(btn);
  f.appendChild(el("div","small muted",
    `${blk.words.length - wi} of ${blk.words.length} words move to a new block of the same type,`
    + " directly after this one in reading order."
    + (orderMode()==="review"
       ? " In review mode this renumbers every later block, which clears their order-review marker."
       : "")));
  return f;
}

// ---- caption<->figure pairing control ----
// Editing happens on the CAPTION side only, because figure_ref lives on the caption
// (a figure has no field to point back with). The figure side shows the resolved
// partner read-only so selecting a photo still answers "which caption is this?".
function pairingField(blk){
  const f = el("div","field");
  if(isFigure(blk)){
    const cap = captionForFigure(blk);
    f.appendChild(el("label","small muted","caption paired to this figure"));
    if(cap){
      const row=el("div","row");
      const go=el("button",null,`Block #${cap.id} — "${(cap.words||[]).slice(0,4).map(w=>w.text).join(" ")||"(no text)"}"`);
      go.onclick=()=>selectBlock(cap.id); row.appendChild(go); f.appendChild(row);
      f.appendChild(el("div","small muted",`pair source: ${cap.pair_source||"—"} · edit it from that caption`));
    } else {
      f.appendChild(el("div","small muted",
        "none — select the caption you want and pair it there"));
    }
    if(blk.figure_number!=null)
      f.appendChild(el("div","small muted",`printed figure number read from the photo: ${blk.figure_number}`));
    return f;
  }

  // --- caption side ---
  f.appendChild(el("label","small muted","figure this caption belongs to"));
  if(refIsOffPage(blk)){
    f.appendChild(el("div","small muted",
      `paired ACROSS PAGES to ${blk.figure_ref.page_id} · block #${blk.figure_ref.block_id} — `
      + "this editor only pairs within a page, so that ref is shown read-only."));
    const un=el("button",null,"Unpair");
    un.onclick=()=>setPair(blk,null); f.appendChild(un);
    return f;
  }
  const figs = pageFigures();
  const sel = el("select");
  const none = el("option",null,"— not paired —"); none.value=""; sel.appendChild(none);
  for(const fg of figs){
    const claimed = captionForFigure(fg);
    const taken = claimed && claimed.id!==blk.id ? `  (has caption #${claimed.id})` : "";
    const num = fg.figure_number!=null ? ` · figure ${fg.figure_number}` : "";
    const o = el("option",null,`Block #${fg.id} · order ${fg.reading_order}${num}${taken}`);
    o.value = String(fg.id);
    if(blk.figure_ref && blk.figure_ref.block_id===fg.id) o.selected = true;
    sel.appendChild(o);
  }
  if(!blk.figure_ref) none.selected = true;
  sel.onchange = () => setPair(blk, sel.value==="" ? null : parseInt(sel.value,10));
  f.appendChild(sel);
  if(!figs.length)
    f.appendChild(el("div","small muted","no FIGURE blocks on this page — re-type a block to figure first"));

  const bits = [];
  if(blk.caption_number!=null) bits.push(`printed caption number: ${blk.caption_number}`);
  bits.push(blk.figure_ref
    ? `paired by: ${blk.pair_source==="user" ? "you" : (blk.pair_source||"—")}`
    : (blk.pair_source==="user"
        ? "unpaired by you — the renderer will keep it standing alone"
        : "not paired — the grouping pass abstained rather than guess"));
  f.appendChild(el("div","small muted", bits.join(" · ")));
  if(captionClaimLost(blk)){
    // Never let the badge/dropdown imply a pairing the renderer drops.
    const other = captionForFigure(pairedFigure(blk));
    const warn = el("div","small");
    warn.style.color="var(--pair)";
    warn.textContent = `⚠ that figure already belongs to caption #${other.id}`
      + `${other.pair_source==="user" ? " (also yours)" : ` (paired by ${other.pair_source||"?"})`}`
      + ", which the renderer keeps — this caption will still print on its own."
      + " Unpair that one first if this is the correction you want.";
    f.appendChild(warn);
    const go = el("button",null,`Go to caption #${other.id}`);
    go.style.marginTop="6px"; go.onclick=()=>selectBlock(other.id);
    f.appendChild(go);
  }
  if(blk.figure_ref){
    const un=el("button",null,"Unpair"); un.style.marginTop="6px";
    un.onclick=()=>setPair(blk,null); f.appendChild(un);
  }
  return f;
}

function renderBlockList(){
  const host=$("#blocklist"); host.innerHTML="";
  if(orderMode()==="review"){
    const pend = pageBlocksNeedingReview().length;
    const bar = el("div","reviewbar small");
    bar.appendChild(el("span","dot review"));
    bar.appendChild(el("span","grow", pend
      ? `${pend} block${pend>1?"s":""} need order review on this page`
      : "all blocks on this page reviewed"));
    if(pend){ const btn=el("button",null,"Confirm all"); btn.classList.add("small");
      btn.onclick=confirmAllOnPage; bar.appendChild(btn); }
    host.appendChild(bar);
  }
  // Pairing bar — no bulk "pair all" counterpart on purpose: guessing the pairs in
  // bulk is exactly what the grouping pass refuses to do (zero wrong pairs).
  const unpaired = pageCaptionsNeedingPairing().length;
  if(unpaired){
    const bar = el("div","reviewbar pair small");
    bar.appendChild(el("span","dot pair"));
    bar.appendChild(el("span","grow",
      `${unpaired} caption${unpaired>1?"s":""} on this page will print on their own `
      + "(no figure, or the figure went to another caption)"));
    host.appendChild(bar);
  }
  host.appendChild(el("div","small muted",
    "drag a row (or select a block and press Alt+↑ / Alt+↓) to change reading order"
    + (orderMode()==="review"
       ? " — moving a block past another renumbers those it passes, which counts as ruling on their order"
       : "")));
  const blocks=[...page().blocks].sort((a,b)=>a.reading_order-b.reading_order);
  blocks.forEach((blk, idx)=>{
    const row=el("div","blockrow"+(state.selBlock===blk.id?" sel":""));
    row.draggable = true;
    row.dataset.idx = String(idx);
    // HTML5 DnD: dragstart carries the block ID (not the row index) so the drop is
    // resolved against live data even if a re-render reshuffles the DOM mid-drag.
    row.ondragstart = (e)=>{ e.dataTransfer.setData("text/plain", String(blk.id));
      e.dataTransfer.effectAllowed="move"; row.classList.add("dragging"); };
    row.ondragend = ()=>{ row.classList.remove("dragging"); clearDropMarks(); };
    row.ondragover = (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect="move";
      const r=row.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height/2;
      clearDropMarks();
      row.classList.add(after ? "dropafter" : "dropbefore");
      row.dataset.after = after ? "1" : "0"; };
    row.ondragleave = ()=>{ row.classList.remove("dropbefore","dropafter"); };
    row.ondrop = (e)=>{ e.preventDefault();
      const id = parseInt(e.dataTransfer.getData("text/plain"), 10);
      const after = row.dataset.after === "1";
      clearDropMarks();
      if(!Number.isNaN(id)) moveBlock(id, idx + (after ? 1 : 0)); };
    row.appendChild(el("span","grip","⋮⋮"));
    row.appendChild(el("span","ord", String(blk.reading_order)));
    const fig = isCaption(blk) ? pairedFigure(blk) : null;
    const t=el("span","grow", blk.type + (fig?` → #${fig.id}${captionClaimLost(blk)?" ⚠":""}`:"")
      + (blk.text!=null?" · translated":""));
    row.appendChild(t);
    if(orderNeedsReview(blk)) row.appendChild(el("span","dot review"));
    if(captionNeedsPairing(blk)) row.appendChild(el("span","dot pair"));
    if(blk.structure_edited) row.appendChild(el("span","ty","*"));
    row.onclick=()=>selectBlock(blk.id);
    host.appendChild(row);
  });
}

function clearDropMarks(){
  document.querySelectorAll(".blockrow").forEach(r=>r.classList.remove("dropbefore","dropafter"));
}

// ---- settings ----
function renderSettings(){
  const s=state.doc.settings, host=$("#settings"); host.innerHTML="";
  const mk = (label, node) => { const f=el("div","field");
    f.appendChild(el("label","small muted",label)); f.appendChild(node); host.appendChild(f); };

  const mode=el("select"); ["flag","best_guess","patch"].forEach(m=>{const o=el("option",null,m);o.value=m;
    if(m===s.uncertainty_mode)o.selected=true; mode.appendChild(o);});
  mode.onchange=()=>{ pushUndo("change uncertainty mode"); s.uncertainty_mode=mode.value; markDirty(); };
  mk("uncertainty mode", mode);

  const omode=el("select"); ["auto","review"].forEach(m=>{const o=el("option",null,m);o.value=m;
    if(m===(s.order_mode||"auto"))o.selected=true; omode.appendChild(o);});
  omode.onchange=()=>{ pushUndo("change reading-order mode"); s.order_mode=omode.value; markDirty();
    renderPage(); renderBlockList(); renderInspector(); };
  mk("reading-order mode", omode);
  host.appendChild(el("div","small muted",
    "review: mark every block's reading order for confirm/correct before reconstruction. "
    + "Caption↔figure grouping is separate and has no mode — select a caption to pair, "
    + "repair or detach it (unpaired captions are marked on every page)."));

  const src=el("input"); src.value=s.source_language||"";
  src.onchange=()=>{ pushUndo("change source language"); s.source_language=src.value; markDirty(); };
  mk("source language", src);

  const tgt=el("input"); tgt.value=s.target_language||""; tgt.placeholder="(none — set when translating)";
  tgt.onchange=()=>{ pushUndo("change target language");
    s.target_language = tgt.value==="" ? null : tgt.value; markDirty(); };
  mk("target language", tgt);

  const cbWrap=el("div");
  const rh=el("input"); rh.type="checkbox"; rh.checked=s.strip_running_headers;
  rh.onchange=()=>{ pushUndo("toggle strip running headers"); s.strip_running_headers=rh.checked; markDirty(); };
  const l1=el("label","toggle small"); l1.appendChild(rh); l1.appendChild(el("span",null," strip running headers"));
  const pn=el("input"); pn.type="checkbox"; pn.checked=s.strip_page_numbers;
  pn.onchange=()=>{ pushUndo("toggle strip page numbers"); s.strip_page_numbers=pn.checked; markDirty(); };
  const l2=el("label","toggle small"); l2.appendChild(pn); l2.appendChild(el("span",null," strip page numbers"));
  cbWrap.appendChild(l1); cbWrap.appendChild(el("div",null,"")); cbWrap.appendChild(l2);
  mk("stripping", cbWrap);
}

// ---- save / preview ----
async function save(){
  setStatus("saving…");
  const res = await fetch("api/document", { method:"PUT",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(state.doc) });
  if(!res.ok){ const e=await res.json().catch(()=>({})); setStatus("save failed: "+(e.detail||e.error||res.status),"err"); return false; }
  const j = await res.json();
  state.doc = await (await fetch("api/document")).json();   // pick up server-normalized flags
  state.dirty=false; renderAll();
  setStatus(j.has_edits ? "saved · edits protected from re-assemble" : "saved", "ok");
  return true;
}
async function renderPreview(){
  if(state.dirty){ const ok=await save(); if(!ok) return; }
  setStatus("rendering…");
  const res = await fetch("api/render", { method:"POST" });
  if(!res.ok){ const e=await res.json().catch(()=>({})); setStatus("render failed: "+(e.error||res.status),"err"); return; }
  $("#preview").src = "render/page.html?ts=" + Date.now();
  setStatus("preview updated","ok");
}

// ---- wiring ----
$("#prev").onclick=()=>{ if(state.pageIndex>0){ state.pageIndex--; state.selBlock=state.selWord=null; renderAll(); } };
$("#next").onclick=()=>{ if(state.pageIndex<state.doc.pages.length-1){ state.pageIndex++; state.selBlock=state.selWord=null; renderAll(); } };
$("#save").onclick=save;
$("#undo").onclick=undo;
$("#render").onclick=()=>{ showTab("preview"); renderPreview(); };
$("#refreshPreview").onclick=renderPreview;
$("#showWords").onchange=drawOverlays;
$("#showBlocks").onchange=drawOverlays;
$("#pageimg").onload=()=>{};   // percentage overlays need no recompute
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function showTab(name){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
  ["inspect","settings","preview"].forEach(t=>$("#pane-"+t).hidden = (t!==name));
}
window.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key==="s"){ e.preventDefault(); save(); }
  // Ctrl/Cmd+Z: let a focused text field keep its own native undo; ours is for the
  // document model, and stealing the shortcut mid-typing would be the wrong one.
  if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z") && !e.shiftKey){
    const t=e.target, tag=t && t.tagName;
    if(tag==="INPUT" || tag==="TEXTAREA") return;
    e.preventDefault(); undo();
  }
  // Alt+Up/Down moves the selected block — the keyboard route to the same reorder,
  // for users (and headless tests) that cannot perform an HTML5 drag.
  if(e.altKey && (e.key==="ArrowUp"||e.key==="ArrowDown") && state.selBlock!=null){
    e.preventDefault(); nudgeBlock(state.selBlock, e.key==="ArrowUp" ? -1 : +1);
  }
});
window.addEventListener("beforeunload", e=>{ if(state.dirty){ e.preventDefault(); e.returnValue=""; } });

load().catch(err=>{ setStatus("load failed: "+err,"err"); console.error(err); });
</script>
